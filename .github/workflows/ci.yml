name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Single source for the workflow's own Python pin, so the setup-python step
  # and the drift check below it read one value instead of two literals that
  # can slide apart on their own.
  PYTHON_VERSION: '3.11'

jobs:
  check:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pyproject.toml's `requires-python` and this workflow's Python pin
      # drifted in both directions on 2026-09-25 (the workflow ran 3.9 after
      # requires-python had already moved to 3.11, then separately the two
      # disagreed the other way) with nothing catching either. Fail here,
      # before installing anything, rather than let the two decide the
      # question independently.
      - name: Verify workflow Python pin matches pyproject.toml requires-python
        run: |
          requires=$(grep -m1 '^requires-python' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          expected=">=${PYTHON_VERSION}"
          if [ "$requires" != "$expected" ]; then
            echo "::error::pyproject.toml requires-python=$requires but the workflow pins PYTHON_VERSION=$PYTHON_VERSION (expected requires-python=$expected). Update both together."
            exit 1
          fi
          echo "OK: pyproject.toml requires-python=$requires matches the workflow's $PYTHON_VERSION pin"

      # Pinned to the version the developer machine runs, so the gate fails on
      # the interpreter the code is actually debugged against. That was 3.9
      # (macOS system python) until the embedder forced the floor up; both
      # moved together, and they must keep moving together — enforced by the
      # step above.
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          # setup-python's pip cache only auto-detects **/requirements*.txt;
          # this project's dependencies live in pyproject.toml alone (via
          # `pip install -e ".[dev]"`), so without this the cache had no
          # dependency file to key on and was not actually caching anything.
          cache-dependency-path: pyproject.toml

      # The app stores everything in PostgreSQL with pgvector. macOS runners
      # have no service containers, so the server comes from Homebrew, the
      # same way it is installed on the developer machine.
      - name: Start PostgreSQL 17 with pgvector
        run: |
          brew install postgresql@17 pgvector
          brew services start postgresql@17
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          for i in $(seq 1 30); do pg_isready -q && break; sleep 1; done
          createdb language_coach_test
          psql -d language_coach_test -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # One step on purpose. This workflow used to list the checks itself, and
      # it drifted: check_fixture_contamination and check_rule_vacuity were
      # added to dev/check_all.sh and never here, so for weeks a
      # contaminated fixture or a vacuous Japanese rule passed CI while failing
      # the local gate. Calling the script means the two can only ever run the
      # same checks. With no VIRTUAL_ENV and no venv/ in the runner, the script
      # falls through to the python3/pytest/pyflakes that `pip install -e`
      # just put on PATH.
      #
      # This is also where the wheel-packaging regression (`pip install .`
      # shipping 40 files of Python and none of the 80 scenario JSONs) gets
      # caught: dev/tests/test_docker_packaging.py builds the wheel and
      # asserts all 80 scenario files plus explain_topics.json and the web
      # static page are in it, and pytest — run by dev/check_all.sh, above —
      # already collects it from dev/tests/ (see pyproject.toml's
      # [tool.pytest.ini_options] testpaths). A dedicated packaging job would
      # only run the same assertion a second time.
      - name: Run the deterministic gate (dev/check_all.sh)
        run: ./dev/check_all.sh
