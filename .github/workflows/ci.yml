name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3.9 is what the developer machine runs (macOS system python), so CI
      # runs it too. requires-python allows >=3.9, and the gate should fail on
      # the version the code is actually written and debugged against rather
      # than on a newer one that accepts syntax 3.9 would reject.
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # One step on purpose. This workflow used to list the checks itself, and
      # it drifted: check_fixture_contamination and check_rule_vacuity were
      # added to dev/check_all.sh and never here, so for weeks a
      # contaminated fixture or a vacuous Japanese rule passed CI while failing
      # the local gate. Calling the script means the two can only ever run the
      # same checks. With no VIRTUAL_ENV and no venv/ in the runner, the script
      # falls through to the python3/pytest/pyflakes that `pip install -e`
      # just put on PATH.
      - name: Run the deterministic gate (dev/check_all.sh)
        run: ./dev/check_all.sh
