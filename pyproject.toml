[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "language-coach"
version = "0.1.0"
description = "Command-line language-conversation coach running local LLMs on Apple Silicon"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mlx-lm==0.29.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyflakes",
    "coverage",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["scripts*", "tests*", "eval*", "scratch*", "ADRs*", "bug_reports*", "venv*"]

