[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "language-coach"
version = "0.1.0"
description = "Command-line language-conversation coach running local LLMs on Apple Silicon"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mlx-lm==0.29.1",
]

[project.optional-dependencies]
# The web UI is an optional front end; `app/cli.py` and the whole core run
# without it, so a CLI-only install keeps the single-runtime-dependency
# property the project started with.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest",
    "pyflakes",
    "coverage",
    # Needed because tests/test_web.py exercises the web front end, and CI
    # installs only the dev extra.
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["scripts*", "tests*", "eval*", "scratch*", "ADRs*", "bug_reports*", "venv*"]

