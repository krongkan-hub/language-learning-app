[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "language-coach"
version = "0.1.0"
description = "Command-line language-conversation coach running a local LLM on Apple Silicon"
readme = "README.md"
# 3.11. Python 3.9 reached end of life in October 2025, and the embedder
# this project now uses for cross-lingual retrieval (mlx-embeddings)
# requires >=3.10 — so the floor was going to move anyway, and moving it
# to a supported release rather than the minimum that works is the
# version of that decision worth keeping. The full suite passed on 3.11
# unchanged before this line was edited.
requires-python = ">=3.11"
dependencies = [
    "mlx-lm==0.29.1",
    # mlx itself was unpinned, so a fresh install could pull a release that drops
    # an API the client calls (mx.metal.device_info went deprecated in 0.32).
    "mlx>=0.32.4,<0.33",
    # PostgreSQL since 2026-09-27; the server needs the pgvector extension.
    "psycopg[binary]>=3.2",
    # Tracing (app/telemetry.py); OTLP export is opt-in via opentelemetry-exporter-otlp.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
# Semantic retrieval over the learner's own vocabulary (app/retrieval.py).
# Optional on purpose: without it the app ranks due words by recency, which is
# what it did before.
# Needs Python >=3.10, which is part of why the floor moved.
retrieval = [
    "mlx-embeddings>=0.1",
]
dev = [
    "pytest",
    "pyflakes",
    "coverage",
]

# Without this, `pip install .` ships 40 files of Python and NOT ONE of the
# 80 scenario files, or the explain topics — an installed copy
# starts and immediately has no content. Verified by building the wheel and
# listing it, which is the only way this class of bug is ever caught: the repo
# always runs from a source checkout, where the data is simply there.
[tool.setuptools.package-data]
app = [
    "scenarios/data/*.json",
    "scenarios/parts/*.json",
    "explain_topics.json",
    "lexicon/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["scripts*", "tests*", "eval*", "scratch*", "ADRs*", "bug_reports*", "venv*"]

[tool.pytest.ini_options]
# The suite lives at dev/tests/, so neither the rootdir nor the package parent
# puts the project on sys.path — `python -m pytest` worked and the `pytest`
# console script did not, which is a difference nobody should have to know.
pythonpath = ["."]
testpaths = ["dev/tests"]
