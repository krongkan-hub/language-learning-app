[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "language-coach"
version = "0.1.0"
description = "Command-line language-conversation coach running local LLMs on Apple Silicon"
readme = "README.md"
# 3.11. Python 3.9 reached end of life in October 2025, and the embedder
# this project now uses for cross-lingual retrieval (mlx-embeddings)
# requires >=3.10 — so the floor was going to move anyway, and moving it
# to a supported release rather than the minimum that works is the
# version of that decision worth keeping. The full suite passed on 3.11
# unchanged before this line was edited.
requires-python = ">=3.11"
dependencies = [
    "mlx-lm==0.29.1",
]

[project.optional-dependencies]
# The web UI is an optional front end; `app/cli.py` and the whole core run
# without it, so a CLI-only install keeps the single-runtime-dependency
# property the project started with.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest",
    "pyflakes",
    "coverage",
    # Needed because dev/tests/test_web.py exercises the web front end, and CI
    # installs only the dev extra.
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["scripts*", "tests*", "eval*", "scratch*", "ADRs*", "bug_reports*", "venv*"]

[tool.pytest.ini_options]
# The suite lives at dev/tests/, so neither the rootdir nor the package parent
# puts the project on sys.path — `python -m pytest` worked and the `pytest`
# console script did not, which is a difference nobody should have to know.
pythonpath = ["."]
testpaths = ["dev/tests"]
