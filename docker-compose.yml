# The PostgreSQL + pgvector database the app needs, for a machine without a
# Homebrew PostgreSQL:
#
#   docker compose up -d
#   LANGUAGE_COACH_DSN="host=127.0.0.1 port=5433 user=coach password=coach dbname=language_coach" make run
#
# The app itself runs on the host, never in a container: MLX needs Metal
# (docs/DEPLOYMENT.md).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: language_coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    ports:
      # Published for the app on the host (the only place it can run).
      # 5433, so it does not collide with a Homebrew server on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d language_coach"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
