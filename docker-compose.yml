# The web app plus the PostgreSQL + pgvector database it needs.
#
#   docker compose up --build
#
# The database comes up and is usable from the host (e.g. `make web` with
# LANGUAGE_COACH_DSN pointed at it). The app container does NOT serve: the
# web server imports MLX, which does not run on Linux (docs/DEPLOYMENT.md).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: language_coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d language_coach"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
