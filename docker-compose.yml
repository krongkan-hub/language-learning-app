# The web app plus the PostgreSQL + pgvector database it needs.
#
#   docker compose up --build        then open http://127.0.0.1:8000
#
# The app image cannot run local MLX inference on Linux (docs/DEPLOYMENT.md),
# so this is for the web front end and the database, not for playing.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: language_coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d language_coach"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
